# Caller stub. All logic lives in labelzoom/.github — keep this file thin.
name: Node.js CI

on:
  push:
    branches: [ "$default-branch" ]
  pull_request:
    branches: [ "$default-branch" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    uses: labelzoom/.github/.github/workflows/node-build.yml@v1
    permissions:
      contents: read
    # Node version comes from the committed .nvmrc by default. Add
    # `with: {node-version: '22.x', node-version-file: ''}` only to override it.
