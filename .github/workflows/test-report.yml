name: Test Report

# Reusable. Called by each repo's test-report.yml stub.
#
# Why the trigger is NOT here: a workflow is only reusable if `on` includes
# `workflow_call`, and `workflow_run` cannot make a workflow reusable. So the
# `workflow_run` trigger and its conclusion guard stay in the caller stub, and the
# stub's single job calls this.
#
# This works because inside a called workflow the `github` context is the CALLER's,
# so `github.event.workflow_run.*` is fully populated and dorny/test-reporter finds
# the artifact on the triggering run with no input plumbing.

on:
  workflow_call:
    inputs:
      artifact:
        description: 'Name of the artifact uploaded by the build workflow.'
        type: string
        default: 'test-results'
      check-name:
        description: 'Name of the check run to create.'
        type: string
        default: 'JUnit Tests'
      path:
        description: 'Glob for result files INSIDE the downloaded artifact.'
        type: string
        default: '**/*.xml'
      reporter:
        description: 'dorny/test-reporter format (java-junit, jest-junit, dotnet-trx, golang-json, ...).'
        type: string
        default: 'java-junit'
      timeout-minutes:
        type: number
        default: 5

permissions: {}

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read  # action repo access
      actions: read   # download the artifact from the triggering run
      checks: write   # publish the check run
    steps:
      # A build that fails BEFORE running tests uploads nothing, and
      # dorny/test-reporter treats an absent artifact as an error. That turns one
      # honest red X on the build into two, the second saying nothing the first did
      # not. Probing first means the reporter runs only when there is something to
      # report.
      #
      # This lives here rather than in a caller's own `probe` job for the reason the
      # whole file exists: as a separate job it would cost a full billed minute to
      # avoid spending a different one. As a step it reuses this job's runner, costs
      # nothing, and every caller gets it instead of just the one that wrote it.
      - name: Look for the artifact on the triggering run
        id: probe
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
          ARTIFACT: ${{ inputs.artifact }}
        run: |
          set -euo pipefail
          count="$(gh api "repos/${REPO}/actions/runs/${RUN_ID}/artifacts" \
            --jq "[.artifacts[] | select(.name == \"${ARTIFACT}\")] | length")"
          echo "${ARTIFACT} artifacts on run ${RUN_ID}: ${count}"
          if [ "$count" -gt 0 ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No ${ARTIFACT} artifact on run ${RUN_ID}; the build likely failed before running tests. Skipping the report."
          fi

      # pull-requests: write is deliberately absent — with use-actions-summary: false
      # this publishes a check run and never comments on a PR.
      - uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        if: steps.probe.outputs.found == 'true'
        with:
          artifact: ${{ inputs.artifact }}
          name: ${{ inputs.check-name }}
          path: ${{ inputs.path }}
          reporter: ${{ inputs.reporter }}
          use-actions-summary: false
