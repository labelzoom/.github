name: CI

# This repo's own CI. Everything here is callable by 16 other repos, so it gets
# linted harder than anything it serves. The `ci` check is required by the branch
# ruleset on main.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Downloaded and checksum-verified rather than pulled as an action: this repo
      # models the pinning rules it enforces, and a mutable docker tag would not.
      - name: actionlint
        env:
          ACTIONLINT_VERSION: '1.7.7'
          ACTIONLINT_SHA256: '023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757'
        run: |
          set -euo pipefail
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o actionlint.tgz "$url"
          echo "${ACTIONLINT_SHA256}  actionlint.tgz" | sha256sum -c -
          tar xzf actionlint.tgz actionlint
          ./actionlint -color

      - name: zizmor
        env:
          ZIZMOR_VERSION: '1.11.0'
          ZIZMOR_SHA256: 'da35e666827cbb1e6ca98b18b7969657b9f186467bfebfa25e730aac527c36f8'
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          url="https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL -o zizmor.tgz "$url"
          echo "${ZIZMOR_SHA256}  zizmor.tgz" | sha256sum -c -
          tar xzf zizmor.tgz
          # Scoped to these two directories, not `.`: workflow-templates/ holds the
          # org template stubs, whose $default-branch placeholders are not valid
          # workflows, and `ci` is a required check -- it must not go red on those.
          ./zizmor --format plain --min-severity medium --min-confidence low .github/workflows/ actions/

      - name: Assert every reusable workflow declares permissions
        run: |
          set -euo pipefail
          rc=0
          for f in .github/workflows/*.yml; do
            grep -q '^permissions:' "$f" || { echo "::error file=$f::missing top-level permissions:"; rc=1; }
          done
          exit $rc

      # actionlint globs workflow files, and only reads a local action's metadata when
      # a workflow references it as `uses: ./...` -- which a reusable workflow here can
      # never do, since `./` resolves against the CALLER's checkout. So nothing above
      # looks at actions/*/action.yml at all. A missing `shell:` is the classic way a
      # composite action breaks, and it breaks at runtime, in every consumer at once.
      #
      # The same gap costs the action's run: body its shellcheck, which actionlint
      # would have run automatically had it been a workflow. So do both here.
      - name: Lint composite actions
        run: |
          set -euo pipefail
          shopt -s nullglob
          rc=0
          for f in actions/*/action.yml; do
            python3 -c '
          import sys, yaml
          path = sys.argv[1]
          with open(path, encoding="utf-8") as fh:
              doc = yaml.safe_load(fh)
          runs = doc.get("runs") or {}
          if runs.get("using") != "composite":
              sys.exit(f"::error file={path}::runs.using must be composite")
          for key in ("name", "description"):
              if not doc.get(key):
                  sys.exit(f"::error file={path}::missing top-level {key}:")
          for i, step in enumerate(runs.get("steps") or []):
              if "run" in step and not step.get("shell"):
                  sys.exit(f"::error file={path}::step {i} has run: but no shell:")
          ' "$f" || rc=1

            python3 -c '
          import sys, yaml
          with open(sys.argv[1], encoding="utf-8") as fh:
              doc = yaml.safe_load(fh)
          for step in doc["runs"].get("steps") or []:
              if step.get("shell") == "bash" and "run" in step:
                  print(step["run"])
          ' "$f" | shellcheck -s bash - || rc=1
          done
          exit $rc
